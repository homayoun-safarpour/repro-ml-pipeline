[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-ml-pipeline"
version = "0.1.0"
description = "Reproducible sklearn training pipeline with MLflow tracking, Docker, and a signature hash CI gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Homayoun Safarpour", email = "homayoun.safarpour@gmail.com" }]
keywords = [
    "mlops",
    "mlflow",
    "scikit-learn",
    "reproducibility",
    "docker",
    "ci-cd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "mlflow>=2.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/homayoun-safarpour/repro-ml-pipeline"
Repository = "https://github.com/homayoun-safarpour/repro-ml-pipeline"

[project.scripts]
repro-ml = "repro_ml_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
