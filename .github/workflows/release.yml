name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
      - name: Verify release gates
        run: |
          uv sync --frozen --extra dev
          uv run ruff check src tests scripts
          uv run pytest -q
      - name: Verify container stack
        run: |
          docker compose up --build --wait
          curl --fail http://localhost:8000/ready
          docker compose down -v
      - name: Build Python artifacts
        run: uv build
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/homayoun-safarpour/repro-ml-pipeline:${{ github.ref_name }}
            ghcr.io/homayoun-safarpour/repro-ml-pipeline:latest
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
