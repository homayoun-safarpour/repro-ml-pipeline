name: Extension proposal
description: Propose a bounded dataset, signature, registry, or serving extension
title: "[extension] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which reproducibility or serving failure should this address?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: Name the test and command that would prove the change.
    validations:
      required: true
  - type: dropdown
    id: signature
    attributes:
      label: Changes signature semantics
      options:
        - "No"
        - "Yes"
    validations:
      required: true
